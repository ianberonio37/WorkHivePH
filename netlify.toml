# ★INERT IN PRODUCTION (2026-09-06): workhiveph.com is served by VERCEL, not Netlify. The
# /_fixtures/* force-404 below has never applied - /_fixtures/engineering-design-test.html
# answered 200 on the live origin. The intent now lives in .vercelignore, which keeps those
# files out of the deployment entirely.
[build]
  publish = "."

# T1 root hygiene: _fixtures/ holds dev test/backup page copies kept ONLY as negative fixtures
# for detector calibration (resurrection proofs run detectors against them). publish="." would
# serve them; force=true 404s them even though the files exist on disk. Ordered BEFORE the
# catch-all — Netlify applies the first matching rule.
[[redirects]]
  from = "/_fixtures/*"
  to = "/index.html"
  status = 404
  force = true

# Custom 404: any unknown path shows the homepage
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
