<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Export teeth fixture</title>
<!-- Fixture for tools/prove_export_truthful.mjs --self-test (2026-10-21): one export control per ?mode=, each with a
     known right answer. The prover must grade every one of them the known way.
     dead    - the control does nothing and says nothing                              -> E1 (fail)
     view    - the control opens an in-page view (a preview overlay)                   -> reported, not failed
     empty   - nothing is listed and the control says "No entries to export."          -> reported, not failed
     lying   - three entries are listed and the control still says "No entries to export." -> E1 (fail)
     file    - a CSV named for what it holds, carrying every listed entry               -> clean
     short   - a CSV carrying one row while the screen lists three                      -> E4 (fail)
     unnamed - every row, in a file called "download.csv"                               -> E3 (fail)
     zero    - a CSV with its header and no rows                                        -> E2 (fail) -->
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  button { min-height: 44px; padding: 0 16px; }
  #preview-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); }
  #preview-overlay.open { display: block; }
  #preview-overlay p { margin: 24px; padding: 16px; background: Canvas; color: CanvasText; }
  #toast { position: fixed; bottom: 16px; left: 16px; padding: 8px 12px; border: 1px solid; background: Canvas; color: CanvasText; }
</style>
</head>
<body>
<h1>Export teeth fixture</h1>
<p id="mode-line"></p>
<ul id="entry-list"></ul>
<button id="btn-export" type="button">Export CSV</button>
<div id="preview-overlay" role="dialog" aria-modal="true" aria-label="Preview"><p>Preview</p></div>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'dead';
  document.getElementById('mode-line').textContent = 'mode: ' + mode;
  const ENTRIES = ['Pump P-101 seal replaced', 'Conveyor C-3 belt tensioned', 'Compressor K-2 filter changed'];
  const list = document.getElementById('entry-list');
  if (['lying', 'file', 'short', 'unnamed', 'zero'].indexOf(mode) !== -1) {
    ENTRIES.forEach((text) => { const li = document.createElement('li'); li.textContent = text; list.appendChild(li); });
  }
  function save(name, lines) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  }
  function say(text) {
    const t = document.createElement('div');
    t.id = 'toast'; t.setAttribute('role', 'alert'); t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
  }
  const ACTIONS = {
    view: () => document.getElementById('preview-overlay').classList.add('open'),
    empty: () => say('No entries to export.'),
    lying: () => say('No entries to export.'),
    file: () => save('maintenance-entries-2026-10-21.csv', ['entry'].concat(ENTRIES)),
    short: () => save('maintenance-entries-2026-10-21.csv', ['entry', ENTRIES[0]]),
    unnamed: () => save('download.csv', ['entry'].concat(ENTRIES)),
    zero: () => save('maintenance-entries-2026-10-21.csv', ['entry']),
  };
  // mode 'dead': no handler at all
  if (ACTIONS[mode]) document.getElementById('btn-export').addEventListener('click', ACTIONS[mode]);
</script>
</body>
</html>
